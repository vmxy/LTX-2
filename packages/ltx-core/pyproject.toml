[project]
name = "ltx-core"
version = "1.0.0"
description = "Core implementation of Lightricks' LTX-2 model"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "torch~=2.9.1",
    "torchaudio~=2.9.1",
    "torchvision",
    "torchcodec",
    "einops",
    "numpy",
    "transformers>=4.52",
    "safetensors",
    "accelerate",
    "scipy>=1.14",
    "etcd3 @ git+https://github.com/kragniz/python-etcd3.git@e58a899579ba416449c4e225b61f039457c8072a",
]

[project.optional-dependencies]
xformers = ["xformers"]
fp8-trtllm = [
    "tensorrt-llm==1.3.0rc4",
    "onnx>=1.16.0,<1.20.0",
    "openmpi",
]

[tool.uv]
conflicts = [
  [
    { extra = "xformers" },
    { extra = "fp8-trtllm" },
  ],
]
override-dependencies = [
    "torch~=2.9.1"
]
[tool.uv.sources]
tensorrt-llm = { index = "nvidia" }
xformers = { index = "pytorch" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio ={ index = "pytorch" }
torchcodec = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
#url = "https://download.pytorch.org/whl/cu130"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "scikit-image>=0.25.2",
]
